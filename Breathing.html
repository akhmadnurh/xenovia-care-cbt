<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Latihan Napas Interaktif</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #0d1117;
        transition: background 0.6s ease;
        color: #e6edf3;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        overflow: hidden;
        user-select: none;
      }
      #phase-label {
        font-size: 1.6rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        margin-bottom: 6px;
        transition: color 0.4s;
      }
      #timer-label {
        font-size: 3rem;
        font-weight: 800;
        margin-bottom: 16px;
        font-variant-numeric: tabular-nums;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      canvas {
        display: block;
        border-radius: 16px;
      }
      #hint {
        margin-top: 18px;
        font-size: 0.78rem;
        color: #8b949e;
        text-align: center;
        max-width: 300px;
        line-height: 1.5;
        padding: 0 12px;
      }
      #cycle-label {
        margin-top: 10px;
        font-size: 0.85rem;
        color: #58a6ff;
      }
    </style>
  </head>
  <body>
    <div id="phase-label">Bersiap...</div>
    <div id="timer-label">
      <span id="phase-emoji"></span><span id="timer-num">4</span>
    </div>
    <canvas id="canvas"></canvas>
    <div id="cycle-label">Siklus 1 / 5</div>
    <div id="hint">
      Jaga mata tetap terbuka. Ikuti pergerakan titik bercahaya di layar secara
      aktif.
    </div>

    <script>
      // --- Telegram WebApp init ---
      const tg = window.Telegram && window.Telegram.WebApp;
      if (tg) {
        tg.ready();
        tg.expand();
        // Apply Telegram theme colors if available
        if (tg.themeParams && tg.themeParams.bg_color) {
          document.body.style.background = tg.themeParams.bg_color;
        }
      }

      // --- Canvas setup ---
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");
      const SIZE = Math.min(
        window.innerWidth - 16,
        window.innerHeight * 0.55,
        480,
      );
      canvas.width = SIZE;
      canvas.height = SIZE;
      const CX = SIZE / 2;
      const CY = SIZE / 2;
      const R = SIZE * 0.42; // orbit radius
      const DOT_R = SIZE * 0.022; // core dot radius

      // --- Box Breathing phases (4-2-6) ---
      const PHASES = [
        { label: "Tarik Napas", color: "#58a6ff", seconds: 4 },
        { label: "Tahan", color: "#f0883e", seconds: 2 },
        { label: "Hembuskan", color: "#3fb950", seconds: 6 },
      ];
      const TOTAL_CYCLES = 5;
      const PHASE_EMOJI = { "Tarik Napas": "🫁", Tahan: "⏸️", Hembuskan: "🌬️" };
      const BASE_BG = "#0d1117";

      // --- Random walk state (slow, wide exploration) ---
      let dotAngle = Math.random() * Math.PI * 2;
      let dotAngleV = (Math.random() - 0.5) * 0.04;
      let dotDist = R * (0.3 + Math.random() * 0.4);
      let dotDistV = (Math.random() - 0.5) * R * 0.02;

      function updateRandomWalk() {
        // Angle: gentle turn with occasional bigger shifts
        dotAngleV += (Math.random() - 0.5) * 0.01;
        dotAngleV *= 0.985;
        dotAngle += dotAngleV;

        // Distance: strong random push, weak centering — lets dot reach edges
        dotDistV += (Math.random() - 0.5) * R * 0.012;
        dotDistV += (R * 0.5 - dotDist) * 0.0006;
        dotDistV *= 0.975;
        dotDist = Math.max(R * 0.05, Math.min(R * 0.95, dotDist));
      }

      function getPos() {
        return {
          x: CX + dotDist * Math.cos(dotAngle),
          y: CY + dotDist * Math.sin(dotAngle),
        };
      }

      // --- Trail buffer ---
      const TRAIL_LEN = 50;
      const trail = [];

      // --- State ---
      let phaseIdx = 0;
      let phaseElapsed = 0; // seconds elapsed in current phase
      let cycleCount = 1;
      let lastTimestamp = null;
      let done = false;

      const phaseLabel = document.getElementById("phase-label");
      const timerNum = document.getElementById("timer-num");
      const phaseEmoji = document.getElementById("phase-emoji");
      const cycleLabel = document.getElementById("cycle-label");

      function drawFrame(pos, phase, progress) {
        ctx.clearRect(0, 0, SIZE, SIZE);

        // --- Progress ring (phase time remaining) ---
        const ringR = R + DOT_R * 4;
        const startA = -Math.PI / 2;
        const endA = startA + progress * Math.PI * 2;
        ctx.beginPath();
        ctx.arc(CX, CY, ringR, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(255,255,255,0.07)";
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(CX, CY, ringR, startA, endA);
        ctx.strokeStyle = phase.color + "99";
        ctx.lineWidth = 3;
        ctx.lineCap = "round";
        ctx.stroke();
        ctx.lineCap = "butt";

        // Trail
        for (let i = 0; i < trail.length; i++) {
          const alpha = (i / trail.length) * 0.5;
          const radius = DOT_R * 0.6 + (i / trail.length) * DOT_R;
          ctx.beginPath();
          ctx.arc(trail[i].x, trail[i].y, radius, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${hexToRgb(phase.color)},${alpha})`;
          ctx.fill();
        }

        // Glow
        const glowR = DOT_R * 3.5;
        const grd = ctx.createRadialGradient(
          pos.x,
          pos.y,
          0,
          pos.x,
          pos.y,
          glowR,
        );
        grd.addColorStop(0, phase.color + "ff");
        grd.addColorStop(0.4, phase.color + "88");
        grd.addColorStop(1, phase.color + "00");
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, glowR, 0, Math.PI * 2);
        ctx.fillStyle = grd;
        ctx.fill();

        // Core dot
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, DOT_R, 0, Math.PI * 2);
        ctx.fillStyle = "#ffffff";
        ctx.fill();
      }

      function hexToRgb(hex) {
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);
        return `${r},${g},${b}`;
      }

      function tick(timestamp) {
        if (done) return;
        if (!lastTimestamp) lastTimestamp = timestamp;
        const delta = (timestamp - lastTimestamp) / 1000; // seconds
        lastTimestamp = timestamp;

        phaseElapsed += delta;
        const phase = PHASES[phaseIdx];

        if (phaseElapsed >= phase.seconds) {
          phaseElapsed -= phase.seconds;
          phaseIdx = (phaseIdx + 1) % PHASES.length;
          if (phaseIdx === 0) {
            cycleCount++;
            if (cycleCount > TOTAL_CYCLES) {
              done = true;
              phaseLabel.textContent = "✅ Selesai!";
              phaseLabel.style.color = "#3fb950";
              timerNum.textContent = "";
              phaseEmoji.textContent = "";
              cycleLabel.textContent = `${TOTAL_CYCLES} siklus selesai`;
              document.body.style.background = BASE_BG;
              ctx.clearRect(0, 0, SIZE, SIZE);
              let repeatBtn = document.getElementById("repeat-btn");
              if (!repeatBtn) {
                repeatBtn = document.createElement("button");
                repeatBtn.id = "repeat-btn";
                repeatBtn.textContent = "🔄 Ulang";
                repeatBtn.style.cssText =
                  "margin-top:14px;padding:10px 28px;font-size:1rem;font-weight:600;color:#e6edf3;background:#21262d;border:1px solid #30363d;border-radius:10px;cursor:pointer;";
                repeatBtn.onclick = resetExercise;
                cycleLabel.parentElement.insertBefore(
                  repeatBtn,
                  cycleLabel.nextSibling,
                );
              }
              return;
            }
            cycleLabel.textContent = `Siklus ${cycleCount} / ${TOTAL_CYCLES}`;
          }
        }

        const currentPhase = PHASES[phaseIdx];
        updateRandomWalk();
        const pos = getPos();

        trail.push({ x: pos.x, y: pos.y });
        if (trail.length > TRAIL_LEN) trail.shift();

        const progress = phaseElapsed / currentPhase.seconds;
        drawFrame(pos, currentPhase, progress);

        phaseLabel.textContent = currentPhase.label;
        phaseLabel.style.color = currentPhase.color;
        phaseEmoji.textContent = PHASE_EMOJI[currentPhase.label] || "";
        phaseEmoji.style.fontSize = "2rem";
        timerNum.textContent = Math.ceil(currentPhase.seconds - phaseElapsed);
        document.body.style.background = `rgba(${hexToRgb(currentPhase.color)},0.06)`;

        requestAnimationFrame(tick);
      }

      // --- Reset / repeat ---
      function resetExercise() {
        phaseIdx = 0;
        phaseElapsed = 0;
        cycleCount = 1;
        done = false;
        lastTimestamp = null;
        trail.length = 0;
        dotAngle = Math.random() * Math.PI * 2;
        dotAngleV = (Math.random() - 0.5) * 0.04;
        dotDist = R * (0.3 + Math.random() * 0.4);
        dotDistV = (Math.random() - 0.5) * R * 0.02;
        phaseLabel.style.color = "#58a6ff";
        cycleLabel.textContent = `Siklus 1 / ${TOTAL_CYCLES}`;
        document.body.style.background = BASE_BG;
        const btn = document.getElementById("repeat-btn");
        if (btn) btn.remove();
        let c = 3;
        phaseLabel.textContent = "Bersiap...";
        phaseEmoji.textContent = "";
        timerNum.textContent = c;
        const ci = setInterval(() => {
          c--;
          if (c <= 0) {
            clearInterval(ci);
            timerNum.textContent = PHASES[0].seconds;
            requestAnimationFrame(tick);
          } else {
            timerNum.textContent = c;
          }
        }, 1000);
      }

      // Brief countdown before starting
      let countdown = 3;
      phaseLabel.textContent = "Bersiap...";
      phaseEmoji.textContent = "";
      timerNum.textContent = countdown;
      const countdownInterval = setInterval(() => {
        countdown--;
        if (countdown <= 0) {
          clearInterval(countdownInterval);
          timerNum.textContent = PHASES[0].seconds;
          requestAnimationFrame(tick);
        } else {
          timerNum.textContent = countdown;
        }
      }, 1000);
    </script>
  </body>
</html>
